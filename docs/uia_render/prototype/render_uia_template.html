<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UIA Raw Render</title>
<style>
  :root { --bg:#fff; --ink:#1d1d1f; --muted:#8a8a8e; --line:#c9c9ce; --btn:#eef0f3; --link:#1a4fd6; --hl:#ffb000; --bar:#f4f4f6; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bar); color:var(--ink); font-family: system-ui, "Segoe UI", sans-serif; }
  header { position:sticky; top:0; z-index:10; background:var(--bar); border-bottom:1px solid var(--line);
           padding:8px 16px; display:flex; gap:16px; align-items:center; flex-wrap:wrap; font-size:13px; }
  header b { font-weight:600; }
  header .meta { color:var(--muted); overflow-wrap:anywhere; }
  header label { display:flex; gap:6px; align-items:center; cursor:pointer; }
  #wrap { overflow:auto; padding:16px; }
  #page { position:relative; background:var(--bg); margin:0 auto; box-shadow:0 1px 4px rgba(0,0,0,.12); }
  .n { position:absolute; }
  .txt { white-space:nowrap; line-height:1; display:flex; align-items:center; overflow:visible; }
  .Button { border:1px solid #9aa0a8; border-radius:4px; background:var(--btn); }
  .Button.txt { justify-content:center; }
  .Hyperlink.txt, .lnk { color:var(--link); text-decoration:underline; }
  .Table { border:1px solid #777; }
  .DataItem { border:1px solid var(--line); }
  .Image { border:1px dashed var(--muted); background:repeating-linear-gradient(45deg,#f2f2f2 0 6px,#fafafa 6px 12px); }
  .icon { border:1px dashed var(--muted); border-radius:3px; color:var(--muted); font-size:8px !important;
          justify-content:center; text-decoration:none !important; }
  .Edit, .ComboBox { border:1px solid #777; background:#fff; }
  .tab { border:1px solid var(--line); border-bottom:none; border-radius:4px 4px 0 0; }
  body.boxes .n:not(.txt) { outline:1px dotted rgba(255,0,0,.35); }
  .n.hot { outline:2px solid var(--hl) !important; z-index:5; }
  #tip { position:fixed; z-index:20; pointer-events:none; background:#222; color:#fff; font:12px/1.4 ui-monospace,Consolas,monospace;
         padding:6px 8px; border-radius:4px; max-width:520px; display:none; white-space:pre-wrap; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bar:#1c1c1e; --ink:#e5e5ea; --line:#48484a; --muted:#98989d; } }
  :root[data-theme="dark"] { --bar:#1c1c1e; --ink:#e5e5ea; --line:#48484a; --muted:#98989d; }
  #page { color:#1d1d1f; }
</style>
</head>
<body>
<header>
  <b>UIA raw view render</b>
  <span class="meta" id="meta"></span>
  <label><input type="checkbox" id="boxes"> show every UIA box</label>
  <span class="meta">hover any element for its UIA type, classes, box</span>
</header>
<div id="wrap"><div id="page"></div></div>
<div id="tip"></div>
<script>
const D = /*DATA*/null;
const page = document.getElementById('page');
page.style.width = D.W + 'px'; page.style.height = D.H + 'px';
document.getElementById('meta').textContent = `${D.page} · ${D.browser} · ${D.nodes.length} UIA boxes · ${D.W}×${D.H}px`;
const BOXED = new Set(['Button','Table','DataItem','Image','Edit','ComboBox']);
const isIcon = s => /^[-]+$/.test(s.trim());
const tip = document.getElementById('tip');
// one text line's height on this page: the median box height of the Text leaves
const lineH = (() => { const hs = D.nodes.filter(n => n.draw && n.t === 'Text').map(n => n.r[3]).sort((a,b)=>a-b); return hs.length ? hs[hs.length>>1] : 18; })();
// draw containers first (big to small), texts last so they sit on top
const order = [...D.nodes].sort((a,b) => (a.draw - b.draw) || (b.r[2]*b.r[3] - a.r[2]*a.r[3]));
for (const n of order) {
  const [x,y,w,h] = n.r;
  const boxed = BOXED.has(n.t) || (n.t === 'ListItem' && /\bactive\b/.test(n.c));
  if (!n.draw && !boxed) { if (!document.body) continue; }
  const el = document.createElement('div');
  el.className = 'n ' + n.t + (n.t === 'ListItem' && /\bactive\b/.test(n.c) ? ' tab' : '');
  Object.assign(el.style, {left:x+'px', top:y+'px', width:w+'px', height:h+'px'});
  if (n.draw) {
    el.classList.add('txt');
    if (isIcon(n.n)) { el.classList.add('icon'); el.textContent = 'U+' + n.n.trim().codePointAt(0).toString(16).toUpperCase(); }
    else { el.textContent = n.n; el.style.fontSize = Math.max(8, Math.round(Math.min(h, n.t === 'Text' ? h : lineH) * 0.78)) + 'px'; }
    // a link's text inherits the link look from an ancestor Hyperlink
    let p = n.t === 'Button' ? -1 : n.p, hops = 0;
    while (p >= 0 && hops++ < 4) { const a = D.nodes.find(m => m.i === p); if (!a) break; if (a.t === 'Hyperlink') { el.classList.add('lnk'); break; } if (a.t === 'Button') break; p = a.p; }
  } else if (!boxed) { el.style.display = 'none'; }
  el.dataset.info = `${n.t}${n.id ? '  #' + n.id : ''}${n.c ? '  .' + n.c : ''}\nbox ${n.r.join(', ')}\n${n.n ? JSON.stringify(n.n) : '(no name)'}`;
  page.appendChild(el);
}
// shrink each text until it fits its UIA box width
for (const el of page.querySelectorAll('.txt:not(.icon)')) {
  let fs = parseFloat(el.style.fontSize), w = parseFloat(el.style.width);
  while (el.scrollWidth > w + 1 && fs > 7) { fs -= 0.5; el.style.fontSize = fs + 'px'; }
}
// every node, drawn or not, gets a hidden twin for the "show every box" overlay
for (const n of D.nodes) {
  if (n.draw || BOXED.has(n.t)) continue;
  const el = document.createElement('div');
  el.className = 'n ghost ' + n.t;
  const [x,y,w,h] = n.r;
  Object.assign(el.style, {left:x+'px', top:y+'px', width:w+'px', height:h+'px', display:'none', pointerEvents:'none'});
  el.dataset.info = `${n.t}${n.c ? '  .' + n.c : ''}\nbox ${n.r.join(', ')}`;
  page.insertBefore(el, page.firstChild);
}
document.getElementById('boxes').addEventListener('change', e => {
  document.body.classList.toggle('boxes', e.target.checked);
  for (const g of page.querySelectorAll('.ghost')) g.style.display = e.target.checked ? 'block' : 'none';
});
page.addEventListener('mousemove', e => {
  const t = e.target.closest('.n');
  for (const h of page.querySelectorAll('.hot')) if (h !== t) h.classList.remove('hot');
  if (!t || !t.dataset.info) { tip.style.display = 'none'; return; }
  t.classList.add('hot');
  tip.textContent = t.dataset.info; tip.style.display = 'block';
  tip.style.left = Math.min(e.clientX + 14, innerWidth - 540) + 'px'; tip.style.top = (e.clientY + 14) + 'px';
});
page.addEventListener('mouseleave', () => { tip.style.display = 'none'; });
</script>
</body>
</html>
