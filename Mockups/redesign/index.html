<title>Sera Redesign Mockups</title>
<style>
/* Layout: sticky screen tabs on top; each screen is a fixed-size dark app frame in a horizontally scrolling stage,
   with a short "what changes" strip underneath. Colours are the app's own (fixed by the owner). */
:root{
  color-scheme:dark;
  --page:#0b0d0c; --ink:#e8ece9; --ink2:#a9b3ad; --ink3:#6f7a74; --rule:#242a27;
  /* app palette */
  --bg:#202020; --side:#171717; --panel:#141414; --card:#191919; --raise:#1f1f1f;
  --line:#2a2a2a; --line2:#363636; --text:#f8fafc; --text2:#c9d1d9; --muted:#8e8d88; --faint:#6e6e6e;
  --em:#2e9b5f; --em2:#34b76d; --emdim:#1a382b; --emdeep:#0e1f16; --mint:#4cf9b7;
  --danger:#ff4d4d; --dangerdim:#3a1a1a; --warn:#e3b341; --warndim:#33290f; --info:#5aa7ff;
  /* grid (stays white) */
  --g-bg:#fff; --g-alt:#f7faf8; --g-line:#e7ece9; --g-head:#101713; --g-headtx:#cfe9dc; --g-text:#1b2420; --g-mute:#6b7a72; --g-hover:#edf6f1; --g-sel:#d9f2e4;
  --r-s:6px; --r-m:8px; --r-l:12px;
  --ff:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',sans-serif; --mono:Consolas,'Cascadia Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--ink);font:14px/1.5 var(--ff);padding-inline:20px;padding-block:0 60px}
h1,h2,h3,h4,p{margin:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--page);padding-block:14px 0;border-bottom:1px solid var(--rule)}
.top h1{font-size:19px;font-weight:700;letter-spacing:.01em}
.top .sub{color:var(--ink3);font-size:12.5px;margin-top:2px}
.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:12px;scrollbar-width:none}
.tabs button{all:unset;cursor:pointer;padding:9px 14px;font-size:13px;color:var(--ink2);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected=true]{color:var(--mint);border-bottom-color:var(--mint)}
.tabs button:focus-visible{outline:2px solid var(--mint);outline-offset:-2px}
section.screen{display:none;padding-top:22px}
section.screen.on{display:block}
.stage{overflow-x:auto;padding-bottom:10px}
.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:22px 36px;margin-top:22px;max-width:1240px}
.notes h4{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);margin-bottom:8px;font-weight:600}
.notes ul{margin:0;padding-left:17px;color:var(--ink2);font-size:13px;display:grid;gap:5px}
.notes li::marker{color:var(--ink3)}
.notes b{color:var(--ink);font-weight:600}
.legend{font-size:12.5px;color:var(--ink3);margin-bottom:10px}
.legend b{color:var(--ink2)}

/* ---------- app frame ---------- */
.app{display:grid;grid-template-columns:212px 1fr;width:1240px;height:780px;background:var(--bg);color:var(--text);border:1px solid #333;border-radius:10px;overflow:hidden;position:relative;font-size:13px;line-height:1.4}
.app.nosb{grid-template-columns:1fr}
.app *{scrollbar-width:thin;scrollbar-color:#3a3a3a transparent}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.s{width:14px;height:14px}svg.i.l{width:20px;height:20px}
/* sidebar */
.sb{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px 10px 10px}
.brand{display:flex;align-items:center;gap:9px;padding:0 4px 12px}
.logo{width:30px;height:30px;border-radius:8px;background:var(--emdeep);border:1px solid #1e4d34;display:grid;place-items:center;color:var(--mint);font-weight:700;font-size:12px}
.brand b{font-size:14px;line-height:1.15;flex:1;min-width:0}.brand b span{display:block;font-size:11px;color:var(--muted);font-weight:500}
.admin-row{display:flex;align-items:center;justify-content:space-between;padding:8px 6px 10px;color:#a0a0a0;font-size:12px;border-bottom:1px solid var(--line);margin-bottom:8px}
.nav-label{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);padding:12px 8px 5px;font-weight:600}
.nav{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:8px;color:#b9b9b4;cursor:default;position:relative}
.nav:hover{background:#1f1f1f;color:var(--text)}
.nav.on{background:var(--emdim);color:var(--text);font-weight:600}
.nav.on::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--em)}
.nav .kb{margin-left:auto}
.nav.admin{display:flex}
.sb-foot{margin-top:auto;border-top:1px solid var(--line);padding-top:10px;display:grid;gap:8px}
.me{display:flex;align-items:center;gap:8px;padding:2px 4px;font-size:12px;font-weight:600;color:#e0e0e0}
.avatar{width:26px;height:26px;border-radius:50%;background:var(--em);display:grid;place-items:center;color:#fff}
.pill-sync{display:flex;align-items:center;justify-content:center;gap:7px;height:30px;border-radius:15px;border:1px solid #1e4d34;background:var(--emdeep);color:var(--mint);font-size:11.5px;font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:var(--em2);box-shadow:0 0 0 3px rgba(52,183,109,.18);flex:none}
.dot.warn{background:var(--warn);box-shadow:0 0 0 3px rgba(227,179,65,.18)}.dot.off{background:#666;box-shadow:none}.dot.bad{background:var(--danger);box-shadow:0 0 0 3px rgba(255,77,77,.16)}
.ver{text-align:center;color:#6e6e6e;font-size:10px}
/* main */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;padding:20px 24px 16px;gap:14px;position:relative}
.hd{display:flex;align-items:center;gap:12px;min-height:40px}
.hd h2{font-size:21px;font-weight:700;letter-spacing:.005em}
.count{color:var(--muted);font-size:12.5px;background:#191919;border:1px solid var(--line);border-radius:12px;padding:2px 10px}
.sp{flex:1}
/* controls */
.btn{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 13px;border-radius:var(--r-m);background:#1a1a1a;border:1px solid var(--line2);color:var(--text);font:600 12.5px var(--ff);cursor:pointer;white-space:nowrap}
.btn:hover{background:#242424;border-color:#444}
.btn:focus-visible,.ibtn:focus-visible,.chip:focus-visible,.sw:focus-visible{outline:2px solid var(--mint);outline-offset:1px}
.btn.pri{background:var(--em);border-color:var(--em2);color:#fff}.btn.pri:hover{background:var(--em2)}
.btn.soft{background:var(--emdeep);border-color:#1e4d34;color:var(--mint)}.btn.soft:hover{background:#163626}
.btn.dng{background:transparent;border-color:#7a2b2b;color:#ff8d8d}.btn.dng:hover{background:var(--dangerdim)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--text2)}.btn.ghost:hover{background:#222}
.btn.sm{height:28px;padding:0 10px;font-size:12px}.btn.lg{height:38px;padding:0 18px;font-size:13px}
.btn[disabled],.btn.dis{opacity:.4;pointer-events:none}
.ibtn{all:unset;box-sizing:border-box;width:32px;height:32px;display:inline-grid;place-items:center;border-radius:var(--r-m);color:var(--text2);cursor:pointer}
.ibtn:hover{background:#262626;color:var(--text)}.ibtn.bd{border:1px solid var(--line2);background:#1a1a1a}
.inp{box-sizing:border-box;height:34px;background:var(--panel);border:1px solid #303030;border-radius:var(--r-m);color:var(--text);font:13px var(--ff);padding:0 12px;min-width:0;width:100%}
.inp::placeholder{color:#74746f}.inp:focus{outline:none;border-color:var(--mint);box-shadow:0 0 0 3px rgba(76,249,183,.12)}
textarea.inp{height:auto;padding:10px 12px;resize:vertical;line-height:1.5}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#9a9a9a 50%),linear-gradient(135deg,#9a9a9a 50%,transparent 50%);background-position:calc(100% - 17px) 14px,calc(100% - 12px) 14px;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.field{position:relative;display:flex;align-items:center}
.field svg.i{position:absolute;left:11px;color:#7a7a75;pointer-events:none}.field .inp{padding-left:34px}
.sw{all:unset;box-sizing:border-box;width:38px;height:22px;border-radius:11px;background:#2c2c2c;border:1px solid #3c3c3c;position:relative;cursor:pointer;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#bdbdb8;transition:transform .15s,background .15s}
.sw[aria-checked=true]{background:var(--em);border-color:var(--em2)}.sw[aria-checked=true]::after{transform:translateX(16px);background:#fff}
@media (prefers-reduced-motion:reduce){.sw,.sw::after{transition:none}}
.chip{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 13px;border-radius:14px;border:1px solid #333;background:#181818;color:var(--text2);font:500 12.5px var(--ff);cursor:pointer;white-space:nowrap}
.chip:hover{border-color:#4a4a4a;color:var(--text)}
.chip.on{background:var(--emdeep);border-color:var(--em);color:var(--mint)}
.tag{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 8px;border-radius:10px;font-size:11px;font-weight:600;background:#262626;color:#c4c4be;white-space:nowrap}
.tag.g{background:var(--emdim);color:var(--mint)}.tag.w{background:var(--warndim);color:var(--warn)}.tag.r{background:var(--dangerdim);color:#ff9a9a}.tag.b{background:#16263b;color:#8bbcff}.tag.p{background:#2a1f3d;color:#c4a8ff}
.kb{display:inline-block;font:600 10.5px var(--mono);color:#9a9a95;background:#222;border:1px solid #333;border-bottom-width:2px;border-radius:5px;padding:0 5px;line-height:17px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-l)}
.card>header{display:flex;align-items:center;gap:10px;padding:14px 18px 0}
.card>header h3{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.card>header .sp{flex:1}
.mut{color:var(--muted)}.sm{font-size:12px}
/* grid */
.gridwrap{background:var(--g-bg);border-radius:var(--r-l);border:1px solid #333;overflow:hidden;flex:1;min-height:0;display:flex;flex-direction:column;box-shadow:0 1px 0 rgba(255,255,255,.04),0 8px 24px rgba(0,0,0,.35)}
.gridscroll{overflow:auto;flex:1;min-height:0}
table.grid{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed;font-size:13px;color:var(--g-text)}
.grid th{position:sticky;top:0;z-index:1;background:var(--g-head);color:var(--g-headtx);font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;text-align:left;padding:0 14px;height:38px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid th+th{border-left:1px solid #1d2822}
.grid td{padding:0 14px;height:40px;border-bottom:1px solid var(--g-line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid tbody tr:nth-child(even) td{background:var(--g-alt)}
.grid tbody tr:hover td{background:var(--g-hover)}
.grid tbody tr.sel td{background:var(--g-sel);color:#0b2a1a;font-weight:500}
.grid tbody tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--em)}
.grid td.num{color:var(--g-mute);font-variant-numeric:tabular-nums}
.grid td.mono{font-family:var(--mono);font-size:12px;color:#33433a}
.grid tr{cursor:pointer}
.gfoot{height:32px;border-top:1px solid var(--g-line);background:#fbfcfb;color:var(--g-mute);font-size:11.5px;display:flex;align-items:center;padding:0 14px;gap:14px}
.gfoot .kb{background:#f0f3f1;border-color:#d9dfdc;color:#55645c}
.gp{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;margin-right:10px;color:#3a4a41}
.gp i{width:7px;height:7px;border-radius:50%;display:inline-block}
.empty-g{display:grid;place-items:center;flex:1;color:var(--g-mute);text-align:center;padding:30px;gap:6px}
.empty-g b{color:var(--g-text);font-size:14px}
/* selection bar */
.selbar{display:flex;align-items:center;gap:6px;height:44px;padding:0 10px 0 14px;border-radius:10px;background:#1b2a22;border:1px solid #24503a}
.selbar .who{font-weight:600;margin-right:6px;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vr{width:1px;height:22px;background:#2e4a3b;margin:0 6px;flex:none}
.grp{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:#6fa88a;margin-right:2px}
/* panel */
.panel{position:absolute;top:0;right:0;bottom:0;width:520px;background:var(--panel);border-left:1px solid var(--line2);box-shadow:-16px 0 40px rgba(0,0,0,.45);display:flex;flex-direction:column}
.p-hd{padding:16px 20px 14px;border-bottom:1px solid var(--line);display:grid;gap:9px}
.p-top{display:flex;align-items:center;gap:10px}
.p-top h2{font-size:18px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.idchip{font:600 11.5px var(--mono);color:var(--mint);background:var(--emdeep);border:1px solid #1e4d34;border-radius:8px;padding:3px 9px;cursor:pointer}
.p-meta{color:var(--muted);font-size:12.5px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.p-meta .sep{color:#444}
.p-body{overflow:auto;padding:16px 20px 24px;display:grid;gap:14px;align-content:start;flex:1}
.svc{display:flex;align-items:center;gap:10px;padding:11px 18px;border-top:1px solid var(--line)}
.svc:first-of-type{border-top:none}
.svc .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:#222}
.svc .nm{flex:1;font-weight:600;font-size:13.5px}.svc .nm small{display:block;font-weight:400;color:var(--muted);font-size:11.5px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:0 24px;padding:6px 18px 14px}
.kv .f{padding:9px 0;border-bottom:1px solid #222;min-width:0}
.kv .f:nth-last-child(-n+2){border-bottom:none}
.kv label{display:block;font-size:11px;color:var(--muted);margin-bottom:2px}
.kv .v{display:flex;align-items:center;gap:6px;font-size:13.5px;min-width:0}
.kv .v span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kv .v .ibtn{width:24px;height:24px;color:#777}.kv .v .ibtn:hover{color:var(--mint)}
.kv .v.mono span{font-family:var(--mono);font-size:12.5px}
.notset{padding:0 18px 14px;color:#7c7c77;font-size:12px}
.notset b{color:#a0a09a;font-weight:500}
/* toast */
.toast{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:10px 16px;border-radius:10px;background:#12281d;border:1px solid #24503a;color:var(--text);box-shadow:0 10px 30px rgba(0,0,0,.5);font-size:12.5px;max-width:520px}
.toast svg{color:var(--mint)}
/* dialog frame (used by settings, sync, small dialogs) */
.dlg-bg{background:#101010;padding:34px;display:grid;place-items:center}
.dlg{background:var(--bg);border:1px solid #3a3a3a;border-radius:12px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.6);display:flex;flex-direction:column;position:relative;color:var(--text);font-size:13px;line-height:1.4}
.dlg>.d-hd{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.dlg>.d-hd h2{font-size:17px;font-weight:700}.dlg>.d-hd p{color:var(--muted);font-size:12.5px;margin-top:1px}
.d-ic{width:34px;height:34px;border-radius:9px;background:var(--emdeep);border:1px solid #1e4d34;display:grid;place-items:center;color:var(--mint);flex:none}
.d-bd{padding:18px 20px;display:grid;gap:14px;align-content:start;flex:1;min-height:0;overflow:auto}
.d-ft{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--line);background:#1b1b1b}
.d-ft .sp{flex:1}
/* settings */
.set{display:grid;grid-template-columns:236px 1fr;flex:1;min-height:0}
.set-nav{background:var(--side);border-right:1px solid var(--line);padding:14px 10px;overflow:auto;display:flex;flex-direction:column;gap:2px}
.set-nav .nav{height:32px}
.set-main{position:relative;overflow:auto;padding:22px 28px 90px;min-width:0}
.set-main h2{font-size:19px;font-weight:700}
.set-main .lead{color:var(--muted);font-size:12.5px;margin:3px 0 18px;max-width:640px}
.stack{display:grid;gap:14px;max-width:760px}
.row{display:flex;align-items:center;gap:20px;padding:14px 18px;border-top:1px solid #222}
.row:first-child{border-top:none}
.row .t{flex:1;min-width:0}.row .t b{display:block;font-weight:600;font-size:13.5px}.row .t span{display:block;color:var(--muted);font-size:12px;margin-top:2px;max-width:480px}
.row .ctl{width:230px;flex:none;display:flex;justify-content:flex-end;align-items:center;gap:8px}
.row .ctl.sw-only{width:auto}
.stepper{display:flex;align-items:center;border:1px solid #303030;border-radius:8px;background:var(--panel);height:34px;width:100%}
.stepper button{all:unset;width:34px;text-align:center;cursor:pointer;color:var(--text2);font-size:16px}
.stepper button:hover{color:var(--mint)}.stepper span{flex:1;text-align:center;font-variant-numeric:tabular-nums}
.savebar{position:sticky;bottom:-70px;margin-top:22px;max-width:760px;display:flex;align-items:center;gap:12px;padding:10px 12px 10px 16px;border-radius:12px;background:#10261b;border:1px solid var(--em);box-shadow:0 12px 30px rgba(0,0,0,.5);transform:translateY(-70px)}
.savebar[hidden]{display:none}
.savebar span{flex:1;font-weight:600}
.danger-zone{border-color:#5b2323;background:#1b1414}
.danger-zone>header h3{color:#ff8d8d}
/* small tables in dialogs */
table.dt{width:100%;border-collapse:collapse;font-size:12.5px}
table.dt th{text-align:left;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:9px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
table.dt td{padding:10px 14px;border-bottom:1px solid #222;vertical-align:middle}
table.dt tr:last-child td{border-bottom:none}
table.dt tr.sel td{background:#162a20}
table.dt tr{cursor:default}
.empty{display:grid;place-items:center;gap:6px;padding:34px 20px;text-align:center;color:var(--muted)}
.empty b{color:var(--text);font-size:14px}
.empty .ring{width:44px;height:44px;border-radius:50%;background:#1d1d1d;border:1px solid #2e2e2e;display:grid;place-items:center;color:#777;margin-bottom:4px}
.banner{display:flex;align-items:center;gap:10px;padding:9px 14px;border-radius:10px;font-size:12.5px;border:1px solid}
.banner.w{background:var(--warndim);border-color:#5b4814;color:#f1d27c}.banner.r{background:#2a1515;border-color:#5b2323;color:#ffabab}.banner.g{background:#10261b;border-color:#24503a;color:#a9f0cf}
.banner .sp{flex:1}.banner a{color:inherit;text-decoration:underline;cursor:pointer}
.tabs2{display:flex;gap:4px;border-bottom:1px solid var(--line);padding:0 20px;background:#1b1b1b}
.tabs2 button{all:unset;cursor:pointer;padding:11px 14px;color:var(--muted);font-weight:600;font-size:12.5px;border-bottom:2px solid transparent;display:flex;gap:8px;align-items:center}
.tabs2 button:hover{color:var(--text)}.tabs2 button[aria-selected=true]{color:var(--mint);border-bottom-color:var(--mint)}
.tabs2 .n{background:#2a2a2a;color:#ccc;border-radius:9px;font-size:10.5px;padding:0 6px;line-height:17px}
.tabs2 .n.a{background:var(--warndim);color:var(--warn)}
.stat{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:14px 18px 18px}
.stat div{background:#141414;border:1px solid #262626;border-radius:10px;padding:10px 12px}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}.stat span{font-size:11px;color:var(--muted)}
.formula{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:0 18px 4px}
.formula .p{font:600 12px var(--mono);color:var(--mint);background:var(--emdeep);border:1px solid #1e4d34;border-radius:7px;padding:4px 9px}
.formula .p.f{color:var(--warn);background:var(--warndim);border-color:#5b4814}
.formula i{color:var(--muted);font-style:normal}
.log{font:12px/1.65 var(--mono);color:#c9d1d9;background:#0f1412;border:1px solid #1d2622;border-radius:10px;padding:12px 14px;overflow:auto}
.log .ts{color:#6a7a72}.log .tg{display:inline-block;min-width:54px;font-weight:700}

<section><h3>Rules that keep the app fast (apply to every screen)</h3><div class="rules">
<div class="rule"><b>Styling only, no new work at runtime</b>Colours, sizes and layout change. No new timers, polling, animation loops or background threads.</div>
<div class="rule"><b>No widgets per row per refresh</b>The grid keeps its current cell approach. Row pills are drawn in the cell, never as new widgets created on every refresh.</div>
<div class="rule"><b>mdi icons only, and only names that exist</b>Every icon in this file shows its name on hover. The font is the 5.9.55 build and a test fails on a missing name.</div>
<div class="rule"><b>No heavy imports at module level</b>No pandas, openpyxl or new libraries. Lazy imports stay lazy. Start-up must still paint in the same time.</div>
<div class="rule"><b>Keep every objectName and signal</b>Automation, tests and QSS look widgets up by name. Rename nothing. Add new names only.</div>
<div class="rule"><b>Search keeps its 60 s cache</b>Layout changes must not call refresh() on tab switch or clear the search box.</div></div></section></div>`,

/* ---------- boot ---------- */
const order=['foundation','search','panel','settings','sync','audit','dialogs'];
const tabs=document.getElementById('tabs'),host=document.getElementById('screens');
function noteHtml(n){if(!n)return'';return `<div class="notes"><div><h4>What changes</h4><ul>${n.c.map(x=>`<li>${x}</li>`).join('')}</ul></div><div><h4>Kept as it is</h4><ul>${n.k.map(x=>`<li>${x}</li>`).join('')}</ul></div><div><h4>Try it</h4><ul>${n.t.map(x=>`<li>${x}</li>`).join('')}</ul></div></div>`;}
order.forEach(k=>{const b=document.createElement('button');b.textContent=S[k].tab;b.setAttribute('role','tab');b.dataset.k=k;tabs.appendChild(b);
 const s=document.createElement('section');s.className='screen';s.id='s-'+k;s.innerHTML=S[k].html()+noteHtml(S[k].notes);host.appendChild(s);});
function show(k){if(!S[k])k='foundation';order.forEach(x=>{document.getElementById('s-'+x).classList.toggle('on',x===k)});[...tabs.children].forEach(b=>b.setAttribute('aria-selected',b.dataset.k===k));try{history.replaceState(null,'','#'+k)}catch(e){}}
tabs.addEventListener('click',e=>{const b=e.target.closest('button');if(b)show(b.dataset.k)});
show((location.hash||'').slice(1)||'foundation');
/* switches + chips */
document.addEventListener('click',e=>{const s=e.target.closest('.sw');if(s){s.setAttribute('aria-checked',s.getAttribute('aria-checked')!=='true');const bar=document.getElementById('savebar');if(bar&&s.closest('#setmain'))bar.hidden=false;}
 const c=e.target.closest('.chip');if(c&&c.parentElement){[...c.parentElement.querySelectorAll('.chip')].forEach(x=>{if(x!==c&&x.classList.contains('on'))x.classList.remove('on')});c.classList.toggle('on',true);}});
document.addEventListener('input',e=>{if(e.target.closest('#setmain')){const b=document.getElementById('savebar');if(b)b.hidden=false}});
/* search: row select + panel */
const appS=document.getElementById('app-search');
appS.addEventListener('click',e=>{const tr=e.target.closest('tbody tr');if(!tr)return;appS.querySelectorAll('tr.sel').forEach(x=>x.classList.remove('sel'));tr.classList.add('sel');const n=people[+tr.dataset.i][0];appS.querySelector('.selbar .who').textContent=n;});
/* panel screen: hide low-priority columns */
document.getElementById('app-panel').querySelectorAll('.col-lo').forEach(x=>x.style.display='none');document.querySelector('#app-panel colgroup col:nth-child(3)').style.width='150px';
/* settings */
const sm=document.getElementById('setmain'),sn=document.getElementById('setnav');
function setPage(p){sn.querySelectorAll('.nav').forEach(n=>n.classList.toggle('on',n.dataset.p===p));sm.innerHTML=SETPAGE[p]()+`<div class="savebar" id="savebar" hidden><span>You have unsaved changes</span><button class="btn" id="discard">Discard</button><button class="btn pri" id="save">${I('check')}Save changes</button></div>`;sm.scrollTop=0;
 sm.querySelector('#discard').onclick=()=>setPage(p);sm.querySelector('#save').onclick=()=>{sm.querySelector('#savebar').hidden=true};}
sn.addEventListener('click',e=>{const n=e.target.closest('.nav[data-p]');if(n)setPage(n.dataset.p)});
document.getElementById('setq').addEventListener('input',e=>{const q=e.target.value.toLowerCase();sn.querySelectorAll('.nav[data-p]').forEach(n=>n.style.display=n.textContent.toLowerCase().includes(q)?'':'none')});
setPage('general');
/* sync tabs */
const sb=document.getElementById('syncBody'),st=document.getElementById('syncTabs');
function syncShow(t){st.querySelectorAll('button').forEach(b=>b.setAttribute('aria-selected',b.dataset.t===t));sb.innerHTML=SYNCP[t]();}
st.addEventListener('click',e=>{const b=e.target.closest('button');if(b)syncShow(b.dataset.t)});syncShow('members');
