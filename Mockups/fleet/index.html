<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sera Fleet Mockup</title>
<style>
/* =====================================================================
   TOKENS. One block; the Qt build reads the same names from ui/utils/tokens.py.
   ===================================================================== */
:root{
  color-scheme:dark;
  /* surfaces */
  --bg:#202020; --side:#171717; --panel:#141414; --card:#191919; --raise:#1f1f1f; --hover:#262626;
  --line:#2a2a2a; --line2:#363636; --line3:#444444;
  /* text */
  --text:#f8fafc; --text2:#c9d1d9; --muted:#8e8d88; --faint:#6e6e6e;
  /* emerald: the one primary */
  --em:#2e9b5f; --em2:#34b76d; --emdim:#1a382b; --emdeep:#0e1f16; --emline:#1e4d34; --mint:#4cf9b7;
  /* status */
  --danger:#ff4d4d; --dangertx:#ff8d8d; --dangerdim:#3a1a1a; --dangerline:#7a2b2b;
  --warn:#e3b341; --warndim:#33290f; --warnline:#5b4814;
  --info:#5aa7ff; --infodim:#16263b; --infoline:#24466e;
  --purple:#c4a8ff; --purpledim:#2a1f3d;
  /* the white data grid */
  --g-bg:#ffffff; --g-alt:#f7faf8; --g-line:#e7ece9; --g-head:#101713; --g-headtx:#cfe9dc; --g-text:#1b2420; --g-mute:#6b7a72; --g-hover:#edf6f1; --g-sel:#d9f2e4;
  /* radii */
  --r-s:6px; --r-m:8px; --r-l:12px;
  /* spacing */
  --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:20px; --s-6:24px;
  /* type */
  --f-xs:11px; --f-s:12px; --f-m:13px; --f-l:14px; --f-xl:17px; --f-xxl:21px;
  --ff:'Segoe UI',system-ui,sans-serif; --mono:Consolas,'Cascadia Mono',ui-monospace,monospace;
  /* control sizes */
  --h-ctl:32px; --h-inp:34px; --h-chip:28px; --h-row:40px; --w-ctl:230px; --w-side:212px; --w-setnav:224px;
  /* outer page (not part of the app) */
  --page:#0b0d0c; --ink:#e8ece9; --ink2:#a9b3ad; --ink3:#6f7a74; --rule:#242a27;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--page);color:var(--ink);font:13px/1.45 var(--ff);display:flex;flex-direction:column;min-height:100vh}
h1,h2,h3,h4,p{margin:0}
button{font-family:inherit}

/* ---------- outer chrome (the viewer, not the app) ---------- */
.top{display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:1px solid var(--rule);background:#0e110f;flex-wrap:wrap}
.top h1{font-size:15px;font-weight:700}
.top .sub{color:var(--ink3);font-size:12px}
.top .sp{flex:1}
.seg{display:inline-flex;border:1px solid #2b332e;border-radius:8px;overflow:hidden}
.seg button{all:unset;cursor:pointer;padding:5px 11px;font-size:12px;color:var(--ink2);border-right:1px solid #2b332e}
.seg button:last-child{border-right:none}
.seg button[aria-pressed=true]{background:#163626;color:var(--mint);font-weight:600}
.seg button:focus-visible{outline:2px solid var(--mint);outline-offset:-2px}
.tbtn{all:unset;cursor:pointer;padding:5px 12px;font-size:12px;color:var(--ink);border:1px solid #2b332e;border-radius:8px;background:#141a16}
.tbtn:hover{border-color:#4a5a50}
.tbtn:focus-visible{outline:2px solid var(--mint);outline-offset:1px}
.lbl{font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.08em;margin-right:4px}
.wrap{display:flex;flex:1;min-height:0}
.navlist{width:232px;flex:none;border-right:1px solid var(--rule);overflow:auto;padding:10px 8px 30px;background:#0e110f}
.navlist h4{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);padding:12px 8px 5px;font-weight:600}
.navlist button{all:unset;display:block;width:100%;cursor:pointer;padding:6px 10px;border-radius:7px;font-size:12.5px;color:var(--ink2)}
.navlist button:hover{background:#151b17;color:var(--ink)}
.navlist button[aria-current=page]{background:#163626;color:var(--mint);font-weight:600}
.navlist button:focus-visible{outline:2px solid var(--mint);outline-offset:-2px}
.navlist button small{display:block;font-size:10.5px;color:var(--ink3);font-weight:400}
.stage{flex:1;overflow:auto;padding:18px 20px 40px;min-width:0}
.frame{position:relative;background:var(--bg);border:1px solid #333;border-radius:10px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.5);margin:0 auto}
.frame-cap{display:flex;gap:16px;color:var(--ink3);font-size:12px;margin:8px auto 0;max-width:1366px}
.frame-cap b{color:var(--ink2);font-weight:600}
.about{max-width:1366px;margin:16px auto 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px 28px}
.about h4{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);margin-bottom:6px;font-weight:600}
.about ul{margin:0;padding-left:17px;color:var(--ink2);font-size:12.5px;display:grid;gap:4px}
.about li::marker{color:var(--ink3)}
.about b{color:var(--ink);font-weight:600}
/* lightbox for the Before screenshot */
.lb{position:fixed;inset:0;background:rgba(0,0,0,.86);display:none;z-index:50;flex-direction:column;padding:16px}
.lb.on{display:flex}
.lb .bar{display:flex;align-items:center;gap:12px;color:var(--ink);padding:0 4px 10px}
.lb .bar .sp{flex:1}
.lb .pic{flex:1;overflow:auto;display:grid;place-items:start center}
.lb img{max-width:100%;height:auto;border:1px solid #333;border-radius:6px}
.lb .miss{color:var(--ink2);padding:40px;text-align:center}

/* =====================================================================
   THE APP. Everything inside .app is built from the components below.
   ===================================================================== */
.app{position:absolute;left:0;top:0;transform-origin:0 0;display:grid;grid-template-columns:var(--w-side) 1fr;background:var(--bg);color:var(--text);font-size:var(--f-m);line-height:1.4;overflow:hidden}
.app.nosb,.app.sb-collapsed{grid-template-columns:1fr}
.app.sb-collapsed .sb{display:none}
.app *{scrollbar-width:thin;scrollbar-color:#3a3a3a transparent}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.s{width:14px;height:14px}svg.i.l{width:20px;height:20px}
.sp{flex:1}
.mut{color:var(--muted)}.sm{font-size:var(--f-s)}.xs{font-size:var(--f-xs)}.mono{font-family:var(--mono)}
.row-h{display:flex;align-items:center;gap:var(--s-2)}
.wrapx{flex-wrap:wrap}

/* ---------- sidebar ---------- */
.sb{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:12px 10px 10px;min-height:0}
.brand{display:flex;align-items:center;gap:9px;padding:0 4px 10px}
.brand .logo{width:30px;height:30px;flex:none}
.brand b{font-size:13px;line-height:1.15;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand b span{display:block;font-size:var(--f-xs);color:var(--muted);font-weight:500}
.admin-row{display:flex;align-items:center;justify-content:space-between;padding:8px 6px 10px;color:#a0a0a0;font-size:var(--f-s);border-bottom:1px solid var(--line);margin-bottom:6px}
.nav-label{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);padding:10px 8px 4px;font-weight:600}
.nav{display:flex;align-items:center;gap:10px;height:32px;padding:0 10px;border-radius:var(--r-m);color:#b9b9b4;cursor:pointer;position:relative;white-space:nowrap}
.nav:hover{background:var(--raise);color:var(--text)}
.nav.on{background:var(--emdim);color:var(--text);font-weight:600}
.nav.on::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--em)}
.nav .kb{margin-left:auto}
.nav.sub{padding-left:34px;height:30px;font-size:12.5px}
.sb-foot{margin-top:auto;border-top:1px solid var(--line);padding-top:10px;display:grid;gap:8px}
.me{display:flex;align-items:center;gap:8px;padding:2px 4px;font-size:var(--f-s);font-weight:600;color:#e0e0e0;cursor:pointer;border-radius:var(--r-m)}
.me:hover{background:var(--raise)}
.avatar{width:26px;height:26px;border-radius:50%;background:var(--em);display:grid;place-items:center;color:#fff;flex:none}
.ver{text-align:center;color:var(--faint);font-size:10px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--em2);box-shadow:0 0 0 3px rgba(52,183,109,.18);flex:none;display:inline-block}
.dot.warn{background:var(--warn);box-shadow:0 0 0 3px rgba(227,179,65,.18)}.dot.off{background:#666;box-shadow:none}.dot.bad{background:var(--danger);box-shadow:0 0 0 3px rgba(255,77,77,.16)}.dot.info{background:var(--info);box-shadow:0 0 0 3px rgba(90,167,255,.18)}

/* ---------- main area ---------- */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;padding:16px 20px 12px;gap:12px;position:relative}
.hd{display:flex;align-items:center;gap:10px;min-height:36px}
.hd h2{font-size:var(--f-xxl);font-weight:700;letter-spacing:.005em;white-space:nowrap}
.hd .lead{color:var(--muted);font-size:var(--f-s)}
.count{color:var(--muted);font-size:var(--f-s);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:1px 10px;white-space:nowrap}
.foot{display:flex;align-items:center;gap:14px;color:var(--muted);font-size:var(--f-s);min-height:22px}

/* ---------- COMPONENT: labelled action (.btn) and icon button (.ibtn) ---------- */
.btn{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;gap:7px;height:var(--h-ctl);padding:0 13px;border-radius:var(--r-m);background:#1a1a1a;border:1px solid var(--line2);color:var(--text);font:600 12.5px var(--ff);cursor:pointer;white-space:nowrap}
.btn:hover{background:#242424;border-color:var(--line3)}
.btn:focus-visible,.ibtn:focus-visible,.chip:focus-visible,.sw:focus-visible,.inp:focus-visible,.nav:focus-visible,.tile:focus-visible{outline:2px solid var(--mint);outline-offset:1px}
.btn.pri{background:var(--em);border-color:var(--em2);color:#fff}.btn.pri:hover{background:var(--em2)}
.btn.soft{background:var(--emdeep);border-color:var(--emline);color:var(--mint)}.btn.soft:hover{background:#163626}
.btn.dng{background:transparent;border-color:var(--dangerline);color:var(--dangertx)}.btn.dng:hover{background:var(--dangerdim)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--text2)}.btn.ghost:hover{background:#222}
.btn.sm{height:28px;padding:0 10px;font-size:12px}.btn.lg{height:38px;padding:0 18px;font-size:13px}
.btn[disabled],.btn.dis,.ibtn.dis{opacity:.4;pointer-events:none}
.btn .cv{width:12px;height:12px;border-radius:3px;border:1px solid rgba(0,0,0,.3);flex:none}
.ibtn{all:unset;box-sizing:border-box;width:var(--h-ctl);height:var(--h-ctl);display:inline-grid;place-items:center;border-radius:var(--r-m);color:var(--text2);cursor:pointer;flex:none}
.ibtn:hover{background:var(--hover);color:var(--text)}.ibtn.bd{border:1px solid var(--line2);background:#1a1a1a}
.ibtn.sm{width:24px;height:24px}.ibtn.pri{background:var(--em);color:#fff;border-color:var(--em2)}
.segbtn{display:inline-flex;border:1px solid var(--line2);border-radius:var(--r-m);overflow:hidden;height:var(--h-ctl)}
.segbtn button{all:unset;cursor:pointer;padding:0 14px;display:flex;align-items:center;font:600 12.5px var(--ff);color:var(--text2);border-right:1px solid var(--line2)}
.segbtn button:last-child{border-right:none}
.segbtn button.on{background:var(--em);color:#fff}
/* ---------- COMPONENT: inputs ---------- */
.inp{box-sizing:border-box;height:var(--h-inp);background:var(--panel);border:1px solid #303030;border-radius:var(--r-m);color:var(--text);font:13px var(--ff);padding:0 12px;min-width:0;width:100%}
.inp::placeholder{color:#74746f}.inp:focus{outline:none;border-color:var(--mint);box-shadow:0 0 0 3px rgba(76,249,183,.12)}
textarea.inp{height:auto;padding:10px 12px;resize:vertical;line-height:1.5}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#9a9a9a 50%),linear-gradient(135deg,#9a9a9a 50%,transparent 50%);background-position:calc(100% - 17px) 14px,calc(100% - 12px) 14px;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.field{position:relative;display:flex;align-items:center;min-width:0}
.field>svg.i{position:absolute;left:11px;color:#7a7a75;pointer-events:none}.field .inp{padding-left:34px}
.field .tail{position:absolute;right:6px;display:flex;gap:2px}
.stepper{display:flex;align-items:center;border:1px solid #303030;border-radius:var(--r-m);background:var(--panel);height:var(--h-inp);width:100%}
.stepper button{all:unset;width:34px;text-align:center;cursor:pointer;color:var(--text2);font-size:16px}
.stepper button:hover{color:var(--mint)}.stepper span{flex:1;text-align:center;font-variant-numeric:tabular-nums}
.lab{display:block;font-size:var(--f-xs);color:var(--muted);margin-bottom:4px}
.form{display:grid;gap:12px}
.form .f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cb{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:12.5px}
.cb i{width:16px;height:16px;border-radius:4px;border:1px solid var(--line3);background:#1a1a1a;display:inline-grid;place-items:center;color:#fff;flex:none}
.cb.on i{background:var(--em);border-color:var(--em2)}
.cb i svg{display:none}.cb.on i svg{display:block}
/* ---------- COMPONENT: switch ---------- */
.sw{all:unset;box-sizing:border-box;width:38px;height:22px;border-radius:11px;background:#2c2c2c;border:1px solid #3c3c3c;position:relative;cursor:pointer;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#bdbdb8;transition:transform .15s,background .15s}
.sw[aria-checked=true]{background:var(--em);border-color:var(--em2)}.sw[aria-checked=true]::after{transform:translateX(16px);background:#fff}
.sw[disabled]{opacity:.4;pointer-events:none}
@media (prefers-reduced-motion:reduce){.sw,.sw::after{transition:none}}
/* ---------- COMPONENT: chip ---------- */
.chips{display:flex;gap:6px;align-items:center;flex-wrap:nowrap;min-width:0}
.chip{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;gap:6px;height:var(--h-chip);padding:0 12px;border-radius:14px;border:1px solid #333;background:#181818;color:var(--text2);font:500 12.5px var(--ff);cursor:pointer;white-space:nowrap}
.chip:hover{border-color:#4a4a4a;color:var(--text)}
.chip.on{background:var(--emdeep);border-color:var(--em);color:var(--mint)}
.chip .n{font-size:10.5px;background:#2a2a2a;color:#ccc;border-radius:9px;padding:0 6px;line-height:16px}
.chip.on .n{background:var(--emline);color:var(--mint)}
/* ---------- COMPONENT: pill (status) and tag (type/role) ---------- */
.pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:11px;font-size:var(--f-xs);font-weight:600;background:#262626;color:#c4c4be;white-space:nowrap;border:1px solid transparent}
.pill.g{background:var(--emdeep);color:var(--mint);border-color:var(--emline)}.pill.w{background:var(--warndim);color:var(--warn)}.pill.r{background:var(--dangerdim);color:#ff9a9a}.pill.b{background:var(--infodim);color:#8bbcff}.pill.p{background:var(--purpledim);color:var(--purple)}.pill.o{background:#3a2412;color:#ffb380}
.tag{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:5px;font:600 11px var(--mono);color:#c4c4be;background:#242424;border:1px solid #333;white-space:nowrap}
.tag.g{color:var(--mint);border-color:var(--emline);background:var(--emdeep)}.tag.w{color:var(--warn);border-color:var(--warnline);background:var(--warndim)}.tag.r{color:#ff9a9a;border-color:#5b2323;background:var(--dangerdim)}.tag.b{color:#8bbcff;border-color:var(--infoline);background:var(--infodim)}
.kb{display:inline-block;font:600 10.5px var(--mono);color:#9a9a95;background:#222;border:1px solid #333;border-bottom-width:2px;border-radius:5px;padding:0 5px;line-height:17px;white-space:nowrap}
/* ---------- COMPONENT: card ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-l);min-width:0}
.card>header{display:flex;align-items:center;gap:10px;padding:12px 16px 0;min-height:30px}
.card>header h3{font-size:var(--f-xs);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600;white-space:nowrap}
.card>header .sp{flex:1}
.card .body{padding:12px 16px 14px}
.card.danger{border-color:#5b2323;background:#1b1414}.card.danger>header h3{color:var(--dangertx)}
.card.em{border-color:var(--emline)}.card.em>header h3{color:var(--mint)}
/* ---------- COMPONENT: setting row ---------- */
.srow{display:flex;align-items:center;gap:16px;padding:11px 16px;border-top:1px solid #222}
.card>.srow:first-of-type,.card>header+.srow{border-top:none}
.srow .t{flex:1;min-width:0}.srow .t b{display:block;font-weight:600;font-size:13.5px}.srow .t span{display:block;color:var(--muted);font-size:var(--f-s);margin-top:1px}
.srow .t span.pre{white-space:pre-line}
.srow .ctl{width:var(--w-ctl);flex:none;display:flex;justify-content:flex-end;align-items:center;gap:8px}
.srow .ctl.auto{width:auto}.srow .ctl.wide{width:360px}
.srow.danger .t b{color:var(--dangertx)}
.sub-h{font-size:var(--f-xs);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:14px 16px 4px;border-top:1px solid #222}
/* ---------- COMPONENT: status strip ---------- */
.strip{display:flex;align-items:center;gap:14px;padding:8px 14px;border-radius:var(--r-l);background:var(--card);border:1px solid var(--line);min-height:44px;flex-wrap:wrap}
.strip .sep{width:1px;height:18px;background:var(--line2)}
.strip b{font-weight:600}
/* ---------- COMPONENT: selection bar ---------- */
.selbar{display:flex;align-items:center;gap:6px;height:44px;padding:0 10px 0 14px;border-radius:10px;background:var(--card);border:1px solid var(--line);overflow:hidden}
.selbar.has{background:#1b2a22;border-color:#24503a}
.selbar .who{font-weight:600;margin-right:6px;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.selbar .hint{color:var(--muted);font-size:var(--f-s)}
.vr{width:1px;height:22px;background:#2e4a3b;margin:0 6px;flex:none}
.grp{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:#6fa88a;margin-right:2px;white-space:nowrap}
/* ---------- COMPONENT: unsaved bar ---------- */
.unsaved{display:flex;align-items:center;gap:12px;padding:8px 10px 8px 14px;border-radius:10px;background:#2a2410;border:1px solid var(--warnline);color:#f1d27c;font-weight:600;min-height:44px}
.unsaved[hidden]{display:none}
.unsaved .sp{flex:1}
/* ---------- COMPONENT: empty state ---------- */
.empty{display:grid;place-items:center;gap:6px;padding:30px 20px;text-align:center;color:var(--muted)}
.empty b{color:var(--text);font-size:var(--f-l)}
.empty .ring{width:44px;height:44px;border-radius:50%;background:#1d1d1d;border:1px solid #2e2e2e;display:grid;place-items:center;color:#777;margin-bottom:4px}
.empty .act{margin-top:6px;display:flex;gap:8px}
/* ---------- COMPONENT: banner, toast ---------- */
.banner{display:flex;align-items:center;gap:10px;padding:9px 14px;border-radius:10px;font-size:12.5px;border:1px solid}
.banner.w{background:var(--warndim);border-color:var(--warnline);color:#f1d27c}.banner.r{background:#2a1515;border-color:#5b2323;color:#ffabab}.banner.g{background:#10261b;border-color:#24503a;color:#a9f0cf}.banner.i{background:var(--infodim);border-color:var(--infoline);color:#bcd8ff}
.banner .sp{flex:1}
.toast{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:10px 16px;border-radius:10px;background:#12281d;border:1px solid #24503a;color:var(--text);box-shadow:0 10px 30px rgba(0,0,0,.5);font-size:12.5px;max-width:520px;z-index:4}
.toast svg{color:var(--mint)}
/* ---------- COMPONENT: white data grid ---------- */
.gridwrap{background:var(--g-bg);border-radius:var(--r-l);border:1px solid #333;overflow:hidden;flex:1;min-height:0;display:flex;flex-direction:column;box-shadow:0 1px 0 rgba(255,255,255,.04),0 8px 24px rgba(0,0,0,.35)}
.gridscroll{overflow:auto;flex:1;min-height:0}
table.grid{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed;font-size:13px;color:var(--g-text)}
.grid th{position:sticky;top:0;z-index:1;background:var(--g-head);color:var(--g-headtx);font-size:var(--f-xs);font-weight:600;letter-spacing:.07em;text-transform:uppercase;text-align:left;padding:0 12px;height:36px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid th+th{border-left:1px solid #1d2822}
.grid td{padding:0 12px;height:var(--h-row);border-bottom:1px solid var(--g-line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid tbody tr:nth-child(even) td{background:var(--g-alt)}
.grid tbody tr:hover td{background:var(--g-hover)}
.grid tbody tr.sel td{background:var(--g-sel);color:#0b2a1a;font-weight:500}
.grid tbody tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--em)}
.grid td.num{color:var(--g-mute);font-variant-numeric:tabular-nums}
.grid td.mono{font-family:var(--mono);font-size:12px;color:#33433a}
.grid td.hl{background:#fff3cd!important;color:#6b4e00}
.grid tr{cursor:pointer}
.grid td.tall{height:52px;white-space:normal;line-height:1.3}
.gfoot{height:30px;border-top:1px solid var(--g-line);background:#fbfcfb;color:var(--g-mute);font-size:11.5px;display:flex;align-items:center;padding:0 12px;gap:14px;flex:none}
.gfoot .kb{background:#f0f3f1;border-color:#d9dfdc;color:#55645c}
.gp{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;margin-right:9px;color:#3a4a41}
.gp i{width:7px;height:7px;border-radius:50%;display:inline-block}
.gpill{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 8px;border-radius:10px;font-size:11px;font-weight:600;white-space:nowrap}
.cellbtns{display:inline-flex;gap:4px;vertical-align:middle}
.cellbtns .ibtn{width:26px;height:26px;color:#3a4a41;border:1px solid #d9dfdc;background:#fff;border-radius:6px}
.cellbtns .ibtn.pri{background:var(--em);color:#fff;border-color:var(--em2)}
.cellbtns .ibtn:hover{background:#edf6f1}
.cellbtns .ibtn.pri:hover{background:var(--em2)}
/* dark grid variant (Tracker Dump keeps its dark table; owner decision) */
.gridwrap.dark{background:var(--panel);border-color:var(--line2);box-shadow:none}
.gridwrap.dark table.grid{color:var(--text2)}
.gridwrap.dark .grid th{background:#0f1512;color:var(--mint)}
.gridwrap.dark .grid td{border-bottom-color:#232323}
.gridwrap.dark .grid tbody tr:nth-child(even) td{background:#171717}
.gridwrap.dark .grid tbody tr:hover td{background:#1f2a24}
.gridwrap.dark .grid tbody tr.sel td{background:#14301f;color:var(--text)}
.gridwrap.dark .grid td.num{color:var(--muted)}
.gridwrap.dark .cellbtns .ibtn{background:#1a1a1a;border-color:var(--line2);color:var(--text2)}
.gridwrap.dark .cellbtns .ibtn:hover{background:var(--hover)}
.gridwrap.dark .cellbtns .ibtn.pri{background:var(--em);color:#fff;border-color:var(--em2)}
/* dark list table (dialogs, settings) */
table.dt{width:100%;border-collapse:collapse;font-size:12.5px}
table.dt th{text-align:left;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:9px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
table.dt td{padding:8px 14px;border-bottom:1px solid #222;vertical-align:middle;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
table.dt tr:last-child td{border-bottom:none}
table.dt tbody tr{cursor:pointer}table.dt tbody tr:hover td{background:#1e1e1e}
table.dt tr.sel td{background:#162a20}
table.dt tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--em)}
/* ---------- panel (client detail) ---------- */
.panel{position:absolute;top:0;right:0;bottom:0;width:540px;background:var(--panel);border-left:1px solid var(--line2);box-shadow:-16px 0 40px rgba(0,0,0,.45);display:flex;flex-direction:column;z-index:3}
.p-hd{padding:14px 18px 12px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.p-top{display:flex;align-items:center;gap:10px}
.p-top h2{font-size:var(--f-xl);font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.idchip{font:600 11.5px var(--mono);color:var(--mint);background:var(--emdeep);border:1px solid var(--emline);border-radius:var(--r-m);padding:3px 9px;cursor:pointer;white-space:nowrap}
.p-meta{color:var(--muted);font-size:12.5px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.p-meta .sep{color:#444}
.p-body{overflow:auto;padding:14px 18px 20px;display:grid;gap:12px;align-content:start;flex:1}
.svc{display:flex;align-items:center;gap:10px;padding:9px 16px;border-top:1px solid var(--line)}
.svc:first-of-type{border-top:none}
.svc .ic{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;background:#222;flex:none}
.svc .nm{flex:1;font-weight:600;font-size:13px;min-width:0}.svc .nm small{display:block;font-weight:400;color:var(--muted);font-size:11.5px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:0 20px;padding:4px 16px 12px}
.kv .f{padding:8px 0;border-bottom:1px solid #222;min-width:0}
.kv .f:nth-last-child(-n+2){border-bottom:none}
.kv label{display:block;font-size:var(--f-xs);color:var(--muted);margin-bottom:1px}
.kv .v{display:flex;align-items:center;gap:4px;font-size:13px;min-width:0}
.kv .v span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kv .v .ibtn{width:24px;height:24px;color:#777}.kv .v .ibtn:hover{color:var(--mint)}
.kv .v.mono span{font-family:var(--mono);font-size:12.5px}
.notset{padding:0 16px 12px;color:#7c7c77;font-size:var(--f-s)}
.notset b{color:#a0a09a;font-weight:500}
/* ---------- dialogs ---------- */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:10;display:grid;place-items:center;padding:20px}
.scrim.desk{background:#0f1412}
.dlg{background:var(--bg);border:1px solid #3a3a3a;border-radius:var(--r-l);overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.6);display:flex;flex-direction:column;position:relative;color:var(--text);font-size:13px;line-height:1.4;max-width:100%;max-height:100%}
.dlg>.d-hd{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.dlg>.d-hd h2{font-size:var(--f-xl);font-weight:700}.dlg>.d-hd p{color:var(--muted);font-size:12.5px;margin-top:1px}
.d-ic{width:34px;height:34px;border-radius:9px;background:var(--emdeep);border:1px solid var(--emline);display:grid;place-items:center;color:var(--mint);flex:none}
.d-ic.w{background:var(--warndim);border-color:var(--warnline);color:var(--warn)}.d-ic.b{background:var(--infodim);border-color:var(--infoline);color:#8bbcff}
.d-bd{padding:16px 18px;display:grid;gap:12px;align-content:start;flex:1;min-height:0;overflow:auto}
.d-ft{display:flex;justify-content:flex-end;gap:10px;padding:12px 18px;border-top:1px solid var(--line);background:#1b1b1b;align-items:center}
.d-ft .sp{flex:1}
.d-full{position:absolute;inset:0;border:none;border-radius:0;box-shadow:none;z-index:10}
[hidden]{display:none!important}
.choice{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:var(--r-l);background:#181818;border:1px solid var(--line2);cursor:pointer}
.choice:hover{border-color:var(--em)}.choice b{display:block;font-size:var(--f-l)}.choice span{color:var(--muted);font-size:12.5px}
.choice .d-ic{width:40px;height:40px}
.progress{height:6px;border-radius:3px;background:#262626;overflow:hidden}.progress i{display:block;height:100%;width:62%;background:var(--em)}
.log{font:12px/1.65 var(--mono);color:var(--text2);background:#0f1412;border:1px solid #1d2622;border-radius:10px;padding:10px 12px;overflow:auto}
.log .ts{color:#6a7a72}.log .tg{display:inline-block;min-width:54px;font-weight:700}
.log .tg.guard{color:var(--warn)}.log .tg.sync{color:var(--mint)}.log .tg.err{color:#ff8d8d}.log .tg.peer{color:#8bbcff}.log .tg.net{color:var(--purple)}
.tabs2{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs2 button{all:unset;cursor:pointer;padding:9px 12px;color:var(--muted);font-weight:600;font-size:12.5px;border-bottom:2px solid transparent;display:flex;gap:8px;align-items:center;margin-bottom:-1px}
.tabs2 button:hover{color:var(--text)}.tabs2 button[aria-selected=true]{color:var(--mint);border-bottom-color:var(--mint)}
.tabs2 .n{background:#2a2a2a;color:#ccc;border-radius:9px;font-size:10.5px;padding:0 6px;line-height:17px}
.tabs2 .n.a{background:var(--warndim);color:var(--warn)}
.stat{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px 16px 14px}
.stat div{background:var(--panel);border:1px solid #262626;border-radius:10px;padding:8px 10px}
.stat b{display:block;font-size:18px;font-variant-numeric:tabular-nums}.stat span{font-size:var(--f-xs);color:var(--muted)}
.formula{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 16px 0}
.formula .p{font:600 11.5px var(--mono);color:var(--mint);background:var(--emdeep);border:1px solid var(--emline);border-radius:7px;padding:3px 8px}
.formula .p.f{color:var(--warn);background:var(--warndim);border-color:var(--warnline)}
.formula i{color:var(--muted);font-style:normal}
/* tiles (tracker) */
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-height:50px;cursor:pointer;min-width:0}
.tile.on{border-color:var(--em)}
.tile b{display:block;font-size:20px;line-height:1.1;font-variant-numeric:tabular-nums}
.tile span{font-size:var(--f-s);color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* settings hub */
.set{display:grid;grid-template-columns:var(--w-setnav) 1fr;flex:1;min-height:0}
.set-nav{background:var(--side);border-right:1px solid var(--line);padding:12px 10px;overflow:auto;display:flex;flex-direction:column;gap:2px}
.set-main{position:relative;overflow:auto;padding:18px 24px 24px;min-width:0;display:flex;flex-direction:column;gap:12px}
.set-main h2{font-size:19px;font-weight:700}
.set-main .lead{color:var(--muted);font-size:12.5px;margin-top:2px;max-width:720px}
.stack{display:grid;gap:12px;max-width:820px}
/* manage clients */
.mc{display:grid;grid-template-columns:360px 1fr;gap:14px;flex:1;min-height:0}
.mc .list{background:var(--g-bg);border:1px solid #333;border-radius:var(--r-l);overflow:auto;display:flex;flex-direction:column}
.mc .li{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--g-line);color:var(--g-text);cursor:pointer;font-size:12.5px}
.mc .li:nth-child(even){background:var(--g-alt)}.mc .li:hover{background:var(--g-hover)}
.mc .li.sel{background:var(--g-sel);box-shadow:inset 3px 0 0 var(--em)}
.mc .li .t{flex:1;min-width:0}.mc .li .t b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mc .li .t small{color:var(--g-mute);font-family:var(--mono);font-size:11px}
.mc .li .svcs{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:150px}
.mc .editor{display:flex;flex-direction:column;gap:10px;min-width:0;min-height:0;overflow:auto}
.mc .ed-hd{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-l)}
.mc .ed-hd .av{width:38px;height:38px;border-radius:10px;background:var(--emdim);color:var(--mint);display:grid;place-items:center;font-weight:700;font-size:15px;flex:none}
.mc .ed-hd h3{font-size:16px;font-weight:700}.mc .ed-hd p{color:var(--muted);font-size:12px}
.mc .cards2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.svcchip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:8px;border:1px solid var(--line2);background:#1a1a1a;font-weight:600;font-size:12.5px;cursor:pointer}
.svcchip.on{background:var(--emdeep);border-color:var(--em);color:var(--mint)}
/* audit */
.audit{display:grid;grid-template-columns:200px 1fr 300px;gap:12px;flex:1;min-height:0}
.ws{display:flex;flex-direction:column;gap:2px;min-width:0}
.ws .nav{justify-content:space-between}
.ws .nav span.c{color:var(--muted);font-size:var(--f-xs);font-family:var(--mono)}
/* sync */
.sync{display:grid;grid-template-columns:1fr 330px;gap:12px;flex:1;min-height:0}
.devcard{display:grid;gap:6px;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel)}
.devcard.sel{border-color:var(--em);background:#10261b}
.devcard .l1{display:flex;align-items:center;gap:10px}
.devcard .facts{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:var(--f-s)}
.devcard .facts b{color:var(--text2);font-weight:600}
/* foundation page */
.fx{padding:18px 22px;display:grid;gap:18px;overflow:auto;align-content:start}
.fx h3{font-size:var(--f-xs);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line);padding-bottom:6px}
.sw-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.sw-c{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.sw-c i{display:block;height:34px}.sw-c div{padding:5px 8px;font-size:11px;color:var(--text2)}.sw-c b{display:block;color:var(--text);font:600 11px var(--mono)}
.demo{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* =====================================================================
   COMPACT width mode (page narrower than 1080 logical px)
   ===================================================================== */
.app.compact .hd .lead{display:none}
.app.compact .hd h2{font-size:var(--f-xl)}
.app.compact .chips-row{flex-direction:column;align-items:stretch}
.app.compact .chips-row .chips{flex-wrap:wrap}
.app.compact .col-lo{display:none}
.withpanel .col-lo2{display:none}

.w-hist{width:250px}.w-period{width:170px}.w-status{width:210px}
.app.compact .w-hist{width:160px}.app.compact .w-period{width:140px}.app.compact .w-status{width:170px}
.set-main>h2+.lead{margin-top:-10px}
.app.compact .srow .ctl.wide{width:300px;flex-wrap:wrap;justify-content:flex-start}.app.compact .srow .ctl.wide select{min-width:170px}
.app.compact .sync{display:flex;flex-direction:column}.app.compact .sync>div:first-child{overflow:visible;flex:none}
.app.compact .selbar .btn span.txt{display:none}
.app.compact .selbar .btn{padding:0 8px}
.app.compact .tiles{gap:6px}
.app.compact .tile{min-height:40px;padding:6px 10px}.app.compact .tile b{font-size:16px}
.app.compact .grid td{height:40px}
.app.compact .hide-c{display:none}
.app.compact .show-c{display:inline-flex}
.show-c{display:none}
.app.compact .wide-only{display:none!important}
.compact-only{display:none!important}
.app.compact .compact-only{display:flex!important}
.app.compact .col-c1,.app.compact .col-c2{display:none}
.app.narrow .col-c3{display:none}
.app.compact .panel{width:100%;border-left:none}
.app.compact .mc{grid-template-columns:300px 1fr}
.app.compact .mc .cards2{grid-template-columns:1fr}
.app.compact .mc .li .svcs{display:none}
.app.compact .audit{grid-template-columns:1fr 280px}
.app.compact .audit .ws{display:none}
.app.compact .sync{grid-template-columns:1fr}
.app.compact .sync .activity{max-height:170px}
.app.compact .set{grid-template-columns:200px 1fr}
.app.compact .srow .ctl{width:200px}
.app.compact .srow .ctl.wide{width:260px}
.app.compact .main{padding:12px 14px 10px}
.app.compact .srow{padding:9px 14px}
</style>
</head>
<body>
<header class="top">
  <div><h1>Sera · Fleet redesign mockup</h1><div class="sub">Every screen and dialog, built from one token block and one component kit. Dark only; grids stay white. Fictional data.</div></div>
  <span class="sp"></span>
  <span class="lbl">Width</span>
  <div class="seg" id="modeSeg"><button aria-pressed="true" data-mode="wide">WIDE 1366</button><button aria-pressed="false" data-mode="compact">COMPACT 1024</button></div>
  <span class="lbl">Scale</span>
  <div class="seg" id="scaleSeg"><button aria-pressed="false" data-scale="0.8">80 %</button><button aria-pressed="true" data-scale="1">100 %</button><button aria-pressed="false" data-scale="1.25">125 %</button></div>
  <span class="lbl">Admin</span>

</header>
<div class="wrap">
  <nav class="navlist" id="navlist" aria-label="Screens"></nav>
  <main class="stage">

    <div class="frame-cap" id="cap"></div>
    <div class="about" id="about"></div>
  </main>
</div>
<div class="lb" id="lb" role="dialog" aria-label="Today's screenshot">
  <div class="bar"><b id="lbTitle">Before</b><span class="sub" id="lbPath"></span><span class="sp"></span><button class="tbtn" id="lbClose">Close</button></div>
  <div class="pic" id="lbPic"></div>
</div>

 const svc=(k,sub,btns,n)=>`<div class="svc"><div class="ic" style="color:${SVC[k]}">${I(k==='Email'?'mail':k==='GST'?'pct':'doc')}</div><div class="nm">${svcName[k]}<small>${sub}</small></div>${btns}<span class="kb" title="Alt+${n} runs mode 1 · Alt+Ctrl+${n} runs mode 2">Alt ${n}</span></div>`;
 const A=`<button class="btn sm pri" title="Fast Autofill (mode 1): the extension fills and submits the login form">${I('bolt','s')}Autofill</button>`;
 const As=`<button class="btn sm" title="SMTI Manual Assist (mode 2, Alt+Ctrl+n): on-page widget to inject User ID / Password yourself">${I('assist','s')}Assist</button>`;
 const C=`<button class="btn sm" title="MECP Manual Copy: a floating card to copy credentials">${I('copy','s')}Copy login</button>`;
 const f=(l,v,mono)=>`<div class="f"><label>${l}</label><div class="v ${mono?'mono':''}"><span title="Click to copy ${l}">${v}</span>${ibtn('copy','Copy '+l,'sm')}</div></div>`;
 const pw=(l,v)=>`<div class="f"><label>${l}</label><div class="v mono"><span>${v}</span>${ibtn('eye','Show / hide password (Settings → Action buttons)','sm')}${ibtn('copy','Copy password · clipboard clears after 30 s','sm')}</div></div>`;
 return `<aside class="panel">
  <div class="p-hd"><div class="p-top">${ibtn('back','Back (Esc)','bd','data-act="closepanel"')}<h2>${p[0]}</h2><span class="idchip" title="Client ID: CLI-${String(s.sel+1).padStart(5,'0')} · click to copy">CLI-${String(s.sel+1).padStart(5,'0')}</span>${s.admin?`${ibtn('dots','More: Services, Archive, Delete','bd','data-act="panelmenu"')}${btn('Edit','sm','edit')}`:ibtn('dots','More: Archive','bd','data-act="panelmenu"')}</div>
   <div class="p-meta"><span>#${s.sel+1}</span><span class="sep">·</span><span class="mono">PAN ${p[2]}</span><span class="sep">·</span><span>${p[1]}</span><span class="sep">·</span>${pill(I('clock','s')+' Autofilled today 11:42','g')}</div>
   ${s.panelMenu?`<div class="card" style="position:absolute;right:76px;top:46px;z-index:7;width:200px;padding:6px;box-shadow:0 14px 30px rgba(0,0,0,.5)"><div class="nav">${I('server')}<span>Services…</span></div><div class="nav">${I('archive')}<span>Archive</span></div>${s.admin?`<div class="nav" style="color:var(--dangertx)">${I('trash')}<span>Delete…</span></div>`:''}</div>`:''}</div>
  <div class="p-body">
   ${card('Services',`<div style="height:6px"></div>${svc('GST','Fast Autofill',A,1)}${svc('IT','Autofill · Assist',A+As,2)}${svc('Email','Copy login',C+`<button class="btn sm dis" title="Off: Assist needs a saved password for this service">${I('assist','s')}Assist</button>`,3)}`,`<span class="mut xs" title="Alt+1…9 runs mode 1. Alt+Ctrl+1…9 runs mode 2 when a service has one.">${I('info','s')} Alt+1…9 · Alt+Ctrl+1…9 for mode 2</span>`)}
   ${card('Identity',`<div class="kv">${f('No.',s.sel+1)}${f('Name of company',p[0])}${f('Name of proprietor',p[1])}${f('GSTIN',p[3]||'Not set',1)}${f('PAN',p[2],1)}${f('Ph. no.',p[4]||'Not set')}</div><div class="notset"><b>Not set:</b> DOB</div>`)}
   ${card('Logins',`<div class="kv">${f('User ID','shar_****',1)}${f('Email','rohan*********',1)}${pw('GST_Password','Digit*****')}${pw('IT_Password','Cjlp@*****')}${pw('Email_Password','Class*****')}</div><div class="notset"><b>Not set:</b> TAN, TDS_Password</div>`,`<span class="mut xs">Masked: first 5 characters shown · clipboard clears after 30 s</span>`)}
   ${card('Notes',`<div class="body" style="padding-top:8px"><textarea class="inp" rows="3" placeholder="Add notes for this client…" aria-label="Notes">Demo client</textarea></div>`,`<span class="mut xs">${I('check','s')} Saved</span>`)}
   ${card('Portal values',`<div class="body mut sm" style="padding-top:6px">Read-only values SGT captured on each portal (Sera Distill profile builder). Shown only when the client has some. <span class="mono" style="color:var(--text2)">Income Tax · Filing status: Verified · AY 2026-27</span></div>`,`${btn('Show','sm ghost','down')}`)}
  </div></aside>`;
}

   ${multi?`<div class="selbar has" style="height:40px"><span class="who">${sels.length} selected</span>${btn('Attach / detach service…','sm','server')}${btn('Archive','sm','archive')}${btn('Restore','sm','restore')}<span class="sp"></span>${btn('Delete permanently','sm dng','trash')}${ibtn('close','Clear selection','','data-act="mcclear"')}</div>`:`<div class="mut xs">Ctrl- or Shift-click to select several clients.</div>`}
  </div>
  <div class="editor">
   <div class="ed-hd"><div class="av">${multi?sels.length:(sels.length?p[0].split(' ').map(w=>w[0]).join('').slice(0,2):'+')}</div><div style="flex:1;min-width:0">${multi?`<h3>${sels.length} clients selected</h3><p>Use the bar under the list to change them together.</p>`:sels.length?`<h3>${p[0]}</h3><p>Client #${sels[0]+1} · Updated today 11:42 · <span style="color:var(--warn)">Unsaved changes</span></p>`:`<h3>New client</h3><p>Fill in the details and press Save. Fields marked * are required.</p>`}</div>${btn('More '+I('down','s'),'','dots','title="Archive client · Restore client · Delete permanently…"')}${btn('Save','pri','check','title="Save this client (Ctrl+S)"')}</div>
   <div class="cards2">

    ${card('Portal logins',`<div class="body form" style="padding-top:8px"><div class="f2">${login('User ID','shar_1234')}${login('Email','rohan@example.in')}${login('TAN','')}${login('GST_Password','Digit1234')}${login('IT_Password','Cjlp@1234')}${login('Email_Password','Class1234')}${login('TDS_Password','')}</div></div>`,`<span class="mut xs">Hidden — use the eye to show</span>`)}
    ${card('Contact',`<div class="body form" style="padding-top:8px">${fld('Ph. no.',p[4])}</div>`)}
    ${card('Attached services',`<div class="body" style="padding-top:8px;display:flex;gap:8px;flex-wrap:wrap">${Object.keys(SVC).map(k=>`<button class="svcchip ${p[5].includes(k)?'on':''}" data-toggle="svc">${svcName[k]}</button>`).join('')}</div>`,`<span class="mut xs">Click to attach or detach</span>`)}
   </div>
   ${card('Notes',`<div class="body" style="padding-top:8px"><textarea class="inp" rows="3" placeholder="Write notes here…" aria-label="Notes"></textarea></div>`)}

 about:{c:['Manage Clients was redesigned earlier and is kept; this pass only moves it onto the kit: the list becomes the <b>white grid</b> style (owner preference, same as the other data lists), chips are the shared <b>chip</b>, the editor header and cards are the shared <b>card</b>, logins get eye + copy in the field.','<b>Bulk selection</b> reuses the <b>selection bar</b> under the list (Attach / detach service…, Archive, Restore, Delete permanently, Clear) instead of a custom strip.','<b>Other details</b> card appears only when a column falls outside Identity / Logins / Contact, as today. The conflict banner ("Inspect Conflicts…") keeps its place above the search box when Sera Sync reports one.','<b>COMPACT</b>: the list narrows to 300 px and hides the service pills (they stay in the editor); the editor cards stack in one column.'],k:['Ctrl+N new client, Ctrl+S save, Esc back; Show archived stays the hidden source of truth behind the Archived chip; sort combo unchanged.'],t:['Click rows in the list; Ctrl-click a second row to see the bulk bar.']}});

/* =====================================================================
   Boot and interaction
   ===================================================================== */
const navlist=document.getElementById('navlist'),frame=document.getElementById('frame'),app=document.getElementById('app'),cap=document.getElementById('cap'),about=document.getElementById('about');
let cur=null;
(function buildNav(){
 let g='';S.forEach(sc=>{if(sc.group!==g){g=sc.group;const h=document.createElement('h4');h.textContent=g;navlist.appendChild(h);}
  const b=document.createElement('button');b.dataset.id=sc.id;b.innerHTML=sc.title+(sc.before?`<small>../current/${sc.before}</small>`:'<small>no screenshot today</small>');navlist.appendChild(b);});
})();
function layout(){
 const W=st.compact?1024:1366,H=768;frame.style.width=W+'px';frame.style.height=H+'px';
 const lw=Math.round(W/st.scale),lh=Math.round(H/st.scale);
 app.style.width=lw+'px';app.style.height=lh+'px';app.style.transform=`scale(${st.scale})`;
 const collapsed=lw<1000&&st.sbUser!==true;
 app.classList.toggle('sb-collapsed',collapsed||st.sbUser===false);
 const pageW=lw-((collapsed||st.sbUser===false||app.classList.contains('nosb'))?0:212);
 app.classList.toggle('compact',pageW<1080);
 app.classList.toggle('narrow',pageW<800);
 cap.innerHTML=`<span>Frame <b>${W} × ${H}</b> px</span><span>Scale <b>${Math.round(st.scale*100)} %</b> → logical <b>${lw} × ${lh}</b></span><span>Page width <b>${pageW}</b> → <b>${pageW<1080?'COMPACT':'WIDE'}</b> (switches below 1080)</span><span>Sidebar <b>${(collapsed||st.sbUser===false)?'collapsed':'shown'}</b>${collapsed?' (auto below 1000)':''}</span>`;
}
function show(id,keep){
 const sc=S.find(x=>x.id===id)||S[0];cur=sc;
 if(!keep){st.dlg=null;st.panelMenu=false;st.colsMenu=false;}
 if(sc.setPage)st.setPage=sc.setPage;
 navlist.querySelectorAll('button').forEach(b=>b.setAttribute('aria-current',b.dataset.id===sc.id?'page':'false'));
 render();
 try{history.replaceState(null,'','#'+sc.id)}catch(e){}
 document.getElementById('beforeBtn').disabled=!sc.before;document.getElementById('beforeBtn').style.opacity=sc.before?1:.4;
 const n=sc.about||{c:[],k:[],t:[]};
 about.innerHTML=`<div><h4>What changes</h4><ul>${n.c.map(x=>`<li>${x}</li>`).join('')||'<li>—</li>'}</ul></div><div><h4>Kept as it is</h4><ul>${n.k.map(x=>`<li>${x}</li>`).join('')||'<li>—</li>'}</ul></div><div><h4>Try it</h4><ul>${n.t.map(x=>`<li>${x}</li>`).join('')||'<li>—</li>'}</ul></div>`;
}
function render(){
 const sc=cur;const nosb=['kit','recovery','firstrun','update','loading','audit','sync','rejoin'].includes(sc.id)||sc.id.startsWith('set-')||['mclmgr','mcledit','svcmgr','svcedit','masterpw'].includes(sc.id);
 app.classList.toggle('nosb',nosb);
 app.innerHTML=sc.render(st);
 layout();
}
/* viewer controls */
document.getElementById('modeSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;st.compact=b.dataset.mode==='compact';[...e.currentTarget.children].forEach(x=>x.setAttribute('aria-pressed',x===b));layout();});
document.getElementById('scaleSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;st.scale=+b.dataset.scale;[...e.currentTarget.children].forEach(x=>x.setAttribute('aria-pressed',x===b));layout();});
document.getElementById('adminSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;st.admin=b.dataset.admin==='1';[...e.currentTarget.children].forEach(x=>x.setAttribute('aria-pressed',x===b));render();});
navlist.addEventListener('click',e=>{const b=e.target.closest('button');if(b)show(b.dataset.id);});
/* Before lightbox */
const lb=document.getElementById('lb');
document.getElementById('beforeBtn').addEventListener('click',()=>{if(!cur||!cur.before)return;document.getElementById('lbTitle').textContent='Before · '+cur.title;document.getElementById('lbPath').textContent='../current/'+cur.before;const pic=document.getElementById('lbPic');pic.innerHTML=`<img src="../current/${cur.before}" alt="Today's ${cur.title}" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'miss',textContent:'Screenshot not found at ../current/${cur.before}. Open this file from Mockups/fleet/ so the relative path resolves.'}))">`;lb.classList.add('on');});
document.getElementById('lbClose').addEventListener('click',()=>lb.classList.remove('on'));
lb.addEventListener('click',e=>{if(e.target===lb)lb.classList.remove('on')});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(lb.classList.contains('on'))lb.classList.remove('on');else if(st.dlg){st.dlg=null;render();}else if(st.panelMenu||st.colsMenu){st.panelMenu=st.colsMenu=false;render();}}});
/* in-app interaction (event delegation) */
function markDirty(el){if(el.closest('[data-nodirty]')||el.hasAttribute('data-nodirty'))return;if(!el.closest('#setmain'))return;st.dirty++;const u=document.getElementById('unsaved');if(u){u.hidden=false;u.querySelector('span').textContent=`${st.dirty} unsaved change${st.dirty===1?'':'s'}`;}document.querySelectorAll('.d-ft [data-act="save"]').forEach(b=>b.removeAttribute('disabled'));}
app.addEventListener('click',e=>{
 const t=e.target;
 const act=t.closest('[data-act]');
 if(act){const a=act.dataset.act;
  if(a==='sbtoggle'){st.sbUser=app.classList.contains('sb-collapsed');layout();return;}
  if(a==='admin'){st.admin=!st.admin;document.querySelectorAll('#adminSeg button').forEach(x=>x.setAttribute('aria-pressed',(x.dataset.admin==='1')===st.admin));render();return;}
  if(a==='openpanel'){show('panel');return;}
  if(a==='closepanel'){show('search');return;}
  if(a==='panelmenu'){st.panelMenu=!st.panelMenu;render();return;}
  if(a==='colsmenu'){st.colsMenu=!st.colsMenu;render();return;}
  if(a==='mcclear'){st.mcSel=[];render();return;}
  if(a==='trk-grouped'){st.trkView='grouped';render();return;}
  if(a==='trk-raw'){st.trkView='raw';render();return;}
  if(a==='discard'||a==='save'){st.dirty=0;render();return;}
  if(a==='setclose'){if(st.dirty){alert('Mockup: the app asks Save / Discard / Keep editing here.');}return;}
 }
 const op=t.closest('[data-open]');if(op){const id=op.dataset.open;const sc=S.find(x=>x.id===id);if(sc){show(id);}return;}
 if(t.closest('[data-close]')&&!t.closest('.dlg')||t.closest('button[data-close]')){
  const back={mcledit:'mclmgr',mclmgr:'set-mcl',svcedit:'svcmgr',svcmgr:'set-services',masterpw:'set-backup',csv:'search',legacy:'search',rejoin:'sync',display:'search'};
  if(back[cur.id]){show(back[cur.id]);return;}}
 const sw=t.closest('.sw');if(sw&&!sw.hasAttribute('disabled')){sw.setAttribute('aria-checked',sw.getAttribute('aria-checked')!=='true');if(sw.dataset.act!=='admin')markDirty(sw);return;}
 const c=t.closest('.cb');if(c){c.classList.toggle('on');c.setAttribute('aria-checked',c.classList.contains('on'));markDirty(c);return;}
 const ch=t.closest('.chip');if(ch){const grp=ch.closest('[data-chips="single"]');if(grp){grp.querySelectorAll('.chip.on').forEach(x=>{if(x!==ch)x.classList.remove('on')});ch.classList.add('on');}else ch.classList.toggle('on');return;}
 const sc=t.closest('.svcchip');if(sc){sc.classList.toggle('on');return;}
 const tile=t.closest('.tile');if(tile){tile.parentElement.querySelectorAll('.tile').forEach(x=>x.classList.toggle('on',x===tile));return;}
 const row=t.closest('tr[data-row]');if(row){const i=+row.dataset.row;st.sel=(st.sel===i)?null:i;const tb=row.closest('tbody');tb.querySelectorAll('tr').forEach(x=>x.classList.toggle('sel',+x.dataset.row===st.sel));const slot=document.getElementById('selslot');if(slot)slot.innerHTML=selbar(st,st.sel===null?null:people[st.sel][0]);return;}
 const mc=t.closest('[data-mc]');if(mc){const i=+mc.dataset.mc;if(e.ctrlKey||e.metaKey||e.shiftKey){st.mcSel=st.mcSel.includes(i)?st.mcSel.filter(x=>x!==i):[...st.mcSel,i];}else st.mcSel=[i];render();return;}
 const au=t.closest('tr[data-audit]');if(au){st.auditSel=+au.dataset.audit;render();return;}
 const mcl=t.closest('tr[data-mcl]');if(mcl&&!t.closest('.cb')&&!t.closest('button')){mcl.parentElement.querySelectorAll('tr').forEach(x=>x.classList.toggle('sel',x===mcl));return;}
 const sp=t.closest('[data-setpage]');if(sp){show('set-'+sp.dataset.setpage,true);return;}
 const stab=t.closest('[data-synctab]');if(stab){st.syncTab=stab.dataset.synctab;render();return;}
 const fr=t.closest('[data-frgo],[data-frstep]');if(fr){st.frStep=fr.dataset.frgo||fr.dataset.frstep;render();return;}
 const lt=t.closest('[data-legtab]');if(lt){st.legTab=lt.dataset.legtab;render();return;}
 const nav=t.closest('[data-nav]');if(nav){const m={clients:'search',manage:'manage',tracker:'tracker',audit:'audit',import:'csv',display:'display',options:'set-general',sync:'sync'};const id=m[nav.dataset.nav];if(id)show(id);return;}
 const stp=t.closest('.stepper button');if(stp){const s=stp.parentElement.querySelector('span');const m=s.textContent.match(/^(\d+)(.*)$/);if(m){s.textContent=(+m[1]+(stp.textContent==='+'?1:-1))+m[2];markDirty(stp);}return;}
});
app.addEventListener('change',e=>{markDirty(e.target);});
app.addEventListener('input',e=>{if(e.target.matches('input[type=text],input:not([type]),textarea'))markDirty(e.target);});
show((location.hash||'').slice(1)||'search');
